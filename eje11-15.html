.jbtn { padding: 5px 16px; font-family: inherit; font-size: 12px; color: #1a1a1a; background: linear-gradient(#FDFDFD, #E3E3E3); border: 1px solid #ADADAD; border-radius: 3px; cursor: pointer; }
.jbtn:hover { background: linear-gradient(#EDF4FC, #D6E6F7); border-color: #7EB4EA; }

<script>
/* =========================================================
   DATOS DE LOS EJERCICIOS 11 AL 15
   ========================================================= */
const EJERCICIOS = {

  /* ============== EJERCICIO 11 ============== */
  11: {
    nombre: "Registro de Transportes",
    formTitulo: "Registro de Transportes",
    campos: [
      { id: "codigo",    label: "Código:",   tipo: "text" },
      { id: "placa",     label: "Placa:",    tipo: "text" },
      { id: "marca",     label: "Marca:",    tipo: "text" },
      { id: "tipo",      label: "Tipo:",     tipo: "combo", opciones: ["Taxi", "Bus", "Mototaxi"] },
      { id: "distancia", label: "Distancia (km):", tipo: "text" }
    ],
    columnas: ["Código", "Placa", "Marca", "Tipo", "Distancia", "Costo"],
    files: [
      { nombre: "Transporte.java", activo: false, codigo: `package com.mycompany.registropersonas.ejercicio11;

<span class="kw">public abstract class</span> <span class="cls">Transporte</span> {
    <span class="kw">protected</span> String codigo;
    <span class="kw">protected</span> String placa;
    <span class="kw">protected</span> String marca;
    <span class="kw">protected double</span> distancia;

    <span class="kw">public</span> Transporte(String codigo, String placa, String marca, <span class="kw">double</span> distancia) {
        <span class="kw">this</span>.codigo = codigo;
        <span class="kw">this</span>.placa = placa;
        <span class="kw">this</span>.marca = marca;
        <span class="kw">this</span>.distancia = distancia;
    }

    <span class="cmt">/** Polimorfismo: cada transporte calcula su costo. */</span>
    <span class="kw">public abstract double</span> calcularCosto();
    <span class="kw">public abstract</span> String getTipo();

    <span class="kw">public</span> String getCodigo() { <span class="kw">return</span> codigo; }
    <span class="kw">public</span> String getPlaca()  { <span class="kw">return</span> placa; }
    <span class="kw">public</span> String getMarca()  { <span class="kw">return</span> marca; }
    <span class="kw">public double</span> getDistancia() { <span class="kw">return</span> distancia; }
}

<span class="cmt">// Taxi: S/ 5 base + S/ 2.50 por km</span>
<span class="kw">class</span> <span class="cls">Taxi</span> <span class="kw">extends</span> <span class="cls">Transporte</span> {
    <span class="kw">public</span> Taxi(String c, String p, String m, <span class="kw">double</span> d) { <span class="kw">super</span>(c, p, m, d); }
    <span class="ann">@Override</span> <span class="kw">public double</span> calcularCosto() { <span class="kw">return</span> 5.00 + (2.50 * distancia); }
    <span class="ann">@Override</span> <span class="kw">public</span> String getTipo() { <span class="kw">return</span> <span class="str">"Taxi"</span>; }
}

<span class="cmt">// Bus: S/ 2.00 por km</span>
<span class="kw">class</span> <span class="cls">Bus</span> <span class="kw">extends</span> <span class="cls">Transporte</span> {
    <span class="kw">public</span> Bus(String c, String p, String m, <span class="kw">double</span> d) { <span class="kw">super</span>(c, p, m, d); }
    <span class="ann">@Override</span> <span class="kw">public double</span> calcularCosto() { <span class="kw">return</span> 2.00 * distancia; }
    <span class="ann">@Override</span> <span class="kw">public</span> String getTipo() { <span class="kw">return</span> <span class="str">"Bus"</span>; }
}

<span class="cmt">// Mototaxi: S/ 3 base + S/ 1.50 por km</span>
<span class="kw">class</span> <span class="cls">Mototaxi</span> <span class="kw">extends</span> <span class="cls">Transporte</span> {
    <span class="kw">public</span> Mototaxi(String c, String p, String m, <span class="kw">double</span> d) { <span class="kw">super</span>(c, p, m, d); }
    <span class="ann">@Override</span> <span class="kw">public double</span> calcularCosto() { <span class="kw">return</span> 3.00 + (1.50 * distancia); }
    <span class="ann">@Override</span> <span class="kw">public</span> String getTipo() { <span class="kw">return</span> <span class="str">"Mototaxi"</span>; }
}` },
      { nombre: "FrmTransporte.java", activo: true, codigo: `package com.mycompany.registropersonas.ejercicio11;

<span class="kw">import</span> java.util.ArrayList;
<span class="kw">import</span> javax.swing.JOptionPane;
<span class="kw">import</span> javax.swing.table.DefaultTableModel;

<span class="kw">public class</span> <span class="cls">FrmTransporte</span> <span class="kw">extends</span> javax.swing.JFrame {

    <span class="kw">private final</span> ArrayList&lt;Transporte&gt; listaTransportes = <span class="kw">new</span> ArrayList&lt;&gt;();
    <span class="kw">private final</span> DefaultTableModel modeloTabla;

    <span class="kw">public</span> FrmTransporte() {
        initComponents();
        modeloTabla = (DefaultTableModel) jTable1.getModel();
        modeloTabla.setColumnIdentifiers(<span class="kw">new</span> Object[]{
            <span class="str">"Código"</span>, <span class="str">"Placa"</span>, <span class="str">"Marca"</span>, <span class="str">"Tipo"</span>, <span class="str">"Distancia"</span>, <span class="str">"Costo"</span>
        });
        modeloTabla.setRowCount(0);
        cboTipo.removeAllItems();
        cboTipo.addItem(<span class="str">"Taxi"</span>);
        cboTipo.addItem(<span class="str">"Bus"</span>);
        cboTipo.addItem(<span class="str">"Mototaxi"</span>);
    }

    <span class="kw">private void</span> btnRegistrarActionPerformed(java.awt.event.ActionEvent evt) {
        String codigo = txtCodigo.getText().trim();
        String placa  = txtPlaca.getText().trim();
        String marca  = txtMarca.getText().trim();
        String tipo   = (String) cboTipo.getSelectedItem();
        String dStr   = txtDistancia.getText().trim();

        <span class="kw">if</span> (codigo.isEmpty() || placa.isEmpty() || marca.isEmpty() || dStr.isEmpty()) {
            JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Todos los campos son obligatorios."</span>);
            <span class="kw">return</span>;
        }
        <span class="kw">double</span> distancia;
        <span class="kw">try</span> {
            distancia = Double.parseDouble(dStr);
            <span class="kw">if</span> (distancia &lt;= 0) {
                JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"La distancia debe ser mayor que cero."</span>);
                <span class="kw">return</span>;
            }
        } <span class="kw">catch</span> (NumberFormatException e) {
            JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Distancia inválida."</span>);
            <span class="kw">return</span>;
        }
        <span class="kw">for</span> (Transporte t : listaTransportes) {
            <span class="kw">if</span> (t.getPlaca().equalsIgnoreCase(placa)) {
                JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Ya existe un transporte con la placa "</span> + placa);
                <span class="kw">return</span>;
            }
        }

        Transporte t;
        <span class="kw">if</span> (tipo.equals(<span class="str">"Taxi"</span>))         t = <span class="kw">new</span> Taxi(codigo, placa, marca, distancia);
        <span class="kw">else if</span> (tipo.equals(<span class="str">"Bus"</span>))     t = <span class="kw">new</span> Bus(codigo, placa, marca, distancia);
        <span class="kw">else</span>                          t = <span class="kw">new</span> Mototaxi(codigo, placa, marca, distancia);

        listaTransportes.add(t);
        <span class="kw">double</span> costo = t.calcularCosto();   <span class="cmt">// Polimorfismo</span>
        modeloTabla.addRow(<span class="kw">new</span> Object[]{codigo, placa, marca, tipo,
            distancia, String.format(<span class="str">"%.2f"</span>, costo)});
        limpiarCampos();
        JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Costo del viaje: S/ "</span>
            + String.format(<span class="str">"%.2f"</span>, costo));
    }

    <span class="kw">private void</span> btnEliminarActionPerformed(java.awt.event.ActionEvent evt) {
        <span class="kw">int</span> fila = jTable1.getSelectedRow();
        <span class="kw">if</span> (fila == -1) {
            JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Seleccione un transporte."</span>);
            <span class="kw">return</span>;
        }
        listaTransportes.remove(fila);
        modeloTabla.removeRow(fila);
    }

    <span class="kw">private void</span> limpiarCampos() {
        txtCodigo.setText(<span class="str">""</span>);
        txtPlaca.setText(<span class="str">""</span>);
        txtMarca.setText(<span class="str">""</span>);
        txtDistancia.setText(<span class="str">""</span>);
        cboTipo.setSelectedIndex(0);
    }
}` }
    ],
    validar: v => {
      if (!v.codigo || !v.placa || !v.marca || !v.distancia) return { ok:false, tipo:'warn', msg:'Todos los campos son obligatorios.' };
      const d = parseFloat(v.distancia);
      if (isNaN(d) || d <= 0) return { ok:false, tipo:'warn', msg:'La distancia debe ser mayor que cero.' };
      return { ok:true };
    },
    claveUnica: 'placa', claveLabel: 'placa',
    calcularFila: v => {
      const d = parseFloat(v.distancia);
      let costo;
      if (v.tipo === 'Taxi') costo = 5 + 2.5 * d;
      else if (v.tipo === 'Bus') costo = 2 * d;
      else costo = 3 + 1.5 * d;
      return [v.codigo, v.placa, v.marca, v.tipo, d, costo.toFixed(2)];
    }
  },

  /* ============== EJERCICIO 12 ============== */
  12: {

function mostrarMensaje(texto, tipo = 'info') {
  const iconos = { info:'i', warn:'!', error:'✕' };
  const titulos = { info:'Información', warn:'Advertencia', error:'Error' };
  $('dlgIcon').className = 'jdialog-icon icon-' + tipo;
  $('dlgIcon').textContent = iconos[tipo];
  $('dlgTitle').textContent = titulos[tipo];
  $('dlgText').textContent = texto;
  $('overlay').classList.add('show');
  $('dlgOk').focus();
}
$('dlgOk').addEventListener('click', () => $('overlay').classList.remove('show'));
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('show'); });

  const ex = EJERCICIOS[ejercicioActual];

  let camposHTML = '';
  ex.campos.forEach(c => {
    if (c.tipo === 'combo') {
      camposHTML += `
        <label for="${c.id}">${c.label}</label>
        <select id="${c.id}">
          ${c.opciones.map(o => `<option value="${o}">${o}</option>`).join('')}
        </select>`;
    } else {
      camposHTML += `
        <label for="${c.id}">${c.label}</label>
        <input id="${c.id}" type="text" autocomplete="off">`;
    }
  });

  design.innerHTML = `
    <div class="jframe">
      <div class="jframe-titlebar">
        <span class="title-icon">▣</span>
        <span class="title-text">${ex.formTitulo}</span>
        <div class="jframe-win-btns">
          <button class="jframe-win-btn">—</button>
          <button class="jframe-win-btn">▢</button>
          <button class="jframe-win-btn close">✕</button>
        </div>
      </div>
      <div class="jframe-content">
        <fieldset class="jpanel-titled">
          <legend>Datos</legend>
          <div class="jgrid">${camposHTML}</div>
          <div class="jbuttons">
            <button class="jbtn" id="btnAccion">Registrar</button>
            <button class="jbtn" id="btnEliminar">Eliminar</button>
            <button class="jbtn" id="btnLimpiar">Limpiar</button>
          </div>
        </fieldset>
        <div class="jscrollpane">
          <table class="jtable">
            <thead>
              <tr>${ex.columnas.map(col => `<th>${col}</th>`).join('')}</tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  if (ejercicioActual === 13) {
    const cbo = $('tipo');
    const l1 = document.querySelector('label[for="info1"]');
    const l2 = document.querySelector('label[for="info2"]');
    const updateUI = () => {
      const t = cbo.value;
      if (t === 'Canción') { l1.textContent = 'Artista:'; l2.textContent = 'Álbum:'; }
      else if (t === 'Podcast') { l1.textContent = 'Creador:'; l2.textContent = 'N.º episodio:'; }
      else { l1.textContent = 'Autor:'; l2.textContent = 'Narrador:'; }
      $('info1').value = ''; $('info2').value = '';
    };
    cbo.addEventListener('change', updateUI);
    updateUI();
  }

  if (ejercicioActual === 14) {
    const cbo = $('tipo');
    const l1 = document.querySelector('label[for="dato1"]');
    const l2 = document.querySelector('label[for="dato2"]');
    const in2 = $('dato2');
    const updateUI = () => {
      const t = cbo.value;
      if (t === 'Círculo') { l1.textContent = 'Radio:'; in2.disabled = true; }
      else if (t === 'Cuadrado') { l1.textContent = 'Lado:'; in2.disabled = true; }
      else { l1.textContent = 'Base:'; in2.disabled = false; }
      l2.style.opacity = in2.disabled ? '0.4' : '1';
      $('dato1').value = ''; in2.value = '';
    };
    cbo.addEventListener('change', updateUI);
    updateUI();
  }

  if (ejercicioActual === 15) {
    const cbo = $('tipo');
    const l = document.querySelector('label[for="dato"]');
    const inD = $('dato');
    const updateUI = () => {
      const t = cbo.value;
      if (t === 'Trabajador fijo') { l.textContent = 'Sueldo mensual:'; inD.disabled = true; inD.value = '2000.00'; }
      else if (t === 'Trabajador por horas') { l.textContent = 'Horas trabajadas:'; inD.disabled = false; inD.value = ''; }
      else { l.textContent = 'Total de ventas:'; inD.disabled = false; inD.value = ''; }
    };
    cbo.addEventListener('change', updateUI);
    updateUI();
  }

  $('btnAccion').addEventListener('click', registrar);
  $('btnEliminar').addEventListener('click', eliminar);
  $('btnLimpiar').addEventListener('click', () => limpiarCampos(true));
  ex.campos.forEach(c => {
    const el = $(c.id);
    if (el && el.tagName === 'INPUT') {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') registrar(); });
    }
  });

  renderTabla();
}

/* =========================================================
   REGISTRAR / ELIMINAR / LIMPIAR
   ========================================================= */
function leerValores() {
  const ex = EJERCICIOS[ejercicioActual];
  const v = {};
  ex.campos.forEach(c => {
    const el = $(c.id);
    v[c.id] = el ? el.value.trim() : '';
  });
  return v;
}

function registrar() {
  const ex = EJERCICIOS[ejercicioActual];
  const v = leerValores();
  const res = ex.validar(v);
  if (!res.ok) return mostrarMensaje(res.msg, res.tipo);

  if (ex.claveUnica) {
    if (!registros[ejercicioActual]) registros[ejercicioActual] = {};
    if (registros[ejercicioActual][v[ex.claveUnica]]) {
      return mostrarMensaje(`Ya existe un registro con el ${ex.claveLabel} ${v[ex.claveUnica]}.`, 'error');
    }
    registros[ejercicioActual][v[ex.claveUnica]] = v;
  }

  if (!contadores[ejercicioActual]) contadores[ejercicioActual] = 1;
  const c = contadores[ejercicioActual];
  const fila = ex.calcularFila(v, c);
  if (ejercicioActual === 14) contadores[ejercicioActual]++;

  if (!tablasDatos[ejercicioActual]) tablasDatos[ejercicioActual] = [];
  tablasDatos[ejercicioActual].push(fila);

  renderTabla();
  limpiarCampos(false);

  let msg = 'Registro guardado correctamente.';
  if (ejercicioActual === 11) msg = `Costo del viaje: S/ ${fila[5]}`;
  if (ejercicioActual === 12) msg = `Monto final: S/ ${fila[5]}`;
  if (ejercicioActual === 13) msg = `Contenido registrado: ${fila[4]}`;
  if (ejercicioActual === 14) msg = `Figura: ${fila[1]} | Área: ${fila[2]} | Perímetro: ${fila[3]}`;
  if (ejercicioActual === 15) msg = `Remuneración: S/ ${fila[4]}`;
  mostrarMensaje(msg, 'info');
}

function eliminar() {
  if (seleccionado < 0) return mostrarMensaje('Seleccione un registro de la tabla para eliminar.', 'warn');
  tablasDatos[ejercicioActual].splice(seleccionado, 1);
  seleccionado = -1;
  renderTabla();
  mostrarMensaje('Registro eliminado.', 'info');
}

function limpiarCampos(enfocar = true) {
  const ex = EJERCICIOS[ejercicioActual];
  ex.campos.forEach(c => {
    const el = $(c.id);
    if (!el) return;
    if (c.tipo === 'combo') el.selectedIndex = 0;
    else el.value = '';
  });
  if (enfocar) {
    const p = $(ex.campos[0].id);
    if (p && !p.disabled) p.focus();
  }
  if (ejercicioActual === 13 || ejercicioActual === 14 || ejercicioActual === 15) {
    const cboTipo = $(ex.campos.find(c => c.tipo === 'combo').id);
    if (cboTipo) cboTipo.dispatchEvent(new Event('change'));
  }
}

function renderTabla() {
  const tbody = $('tbody');
  if (!tbody) return;
  const ex = EJERCICIOS[ejercicioActual];
  const datos = tablasDatos[ejercicioActual] || [];

  tbody.innerHTML = '';
  if (datos.length === 0) {
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    const td = document.createElement('td');
    td.colSpan = ex.columnas.length;
    td.textContent = 'No hay registros.';
    tr.appendChild(td);
    tbody.appendChild(tr);
  } else {
    datos.forEach((fila, i) => {
      const tr = document.createElement('tr');
      if (i === seleccionado) tr.classList.add('selected');
      fila.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      });
      tr.addEventListener('click', () => { seleccionado = i; renderTabla(); });
      tbody.appendChild(tr);
    });
  }
}

/* =========================================================
   TABS
   ========================================================= */
function switchTab(tab) {
  const vs = $('viewSource'), vd = $('viewDesign');
  const ts = $('tabSource'), td = $('tabDesign');
  if (tab === 'source') {
    vs.classList.add('active'); vd.classList.remove('active');
    ts.classList.add('active'); td.classList.remove('active');
  } else {
    vs.classList.remove('active'); vd.classList.add('active');
    ts.classList.remove('active'); td.classList.add('active');
    renderDesign();
  }
}

/* =========================================================
   CAMBIO DE EJERCICIO
   ========================================================= */
document.querySelectorAll('.ex-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ex-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ejercicioActual = parseInt(btn.dataset.ex, 10);
    indiceArchivo = 0;
    seleccionado = -1;
    renderTree();
    renderSource();
    switchTab('source');
    $('outputLog').innerHTML =
      `<span class="out-green">--- exec:3.0:exec (default-cli) @ RegistroPersonas ---</span><br>` +
      `Cargando ejercicio ${ejercicioActual}: ${EJERCICIOS[ejercicioActual].nombre}...<br>` +
      `<span class="out-blue">-------------------------------------------------------</span><br>` +
      `<span class="out-green">BUILD SUCCESSFUL</span>`;
  });
});

$('btnRun').addEventListener('click', () => {
  $('outputLog').innerHTML =
    `<span class="out-green">--- exec:3.0:exec (default-cli) @ RegistroPersonas ---</span><br>` +
    `Ejecutando ejercicio ${ejercicioActual}...<br>` +

    `Total time: 4.212 s<br>` +
    `Finished at: ${new Date().toISOString().replace('T', ' ').substring(0, 19)}<br>` +

});
