<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NetBeans Simulator - Ejercicios 6 al 10 (Intermedio)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; background: #1e1e1e; color: #333; height: 100vh; overflow: hidden; }
.ide { display: flex; flex-direction: column; height: 100vh; background: #F0F0F0; }

.toolbar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: linear-gradient(#FDFDFD, #E8E8E8); border-bottom: 1px solid #C8C8C8; height: 34px; flex-wrap: wrap; }

/* Nav buttons (atrás / adelante) */
.nav-btn {
  padding: 4px 12px;

  font-family: inherit;
  font-weight: 600;
  color: #fff;
  border: 1px solid;
  border-radius: 3px;

}
.nav-btn.back {

}

.nav-btn.forward {
  background: linear-gradient(#4CAF50, #388E3C);

}
.nav-btn.forward:hover {
  background: linear-gradient(#66BB6A, #43A047);

}

.workspace { display: flex; flex: 1; overflow: hidden; }

.left-panel { width: 250px; background: #F0F0F0; border-right: 1px solid #C8C8C8; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 4px 8px; background: linear-gradient(#FAFAFA, #E8E8E8); border-bottom: 1px solid #D0D0D0; font-weight: 600; color: #333; font-size: 11px; }
.tree { flex: 1; overflow-y: auto; padding: 4px 0; }
.tree-node { padding: 3px 8px 3px 16px; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #333; white-space: nowrap; }
.tree-node:hover { background: #EAF2FB; }
.tree-node.active { background: #3875D7; color: #fff; }
.tree-node .icon { font-size: 13px; width: 16px; text-align: center; }
.tree-node.indent-1 { padding-left: 32px; }

.tree-node.indent-3 { padding-left: 64px; }

.center-panel { flex: 1; display: flex; flex-direction: column; background: #FFF; overflow: hidden; }
.editor-tabs { display: flex; background: #E8E8E8; border-bottom: 1px solid #C8C8C8; height: 28px; }
.editor-tab { padding: 0 16px; display: flex; align-items: center; gap: 6px; border-right: 1px solid #D0D0D0; cursor: pointer; color: #555; font-size: 11px; }
.editor-tab.active { background: #FFF; color: #000; border-bottom: 1px solid #FFF; margin-bottom: -1px; font-weight: 600; }

.kw { color: #0000FF; font-weight: bold; }
.str { color: #008000; }

.design-view { flex: 1; display: none; background: #F0F0F0; overflow: auto; padding: 20px; align-items: flex-start; justify-content: center; }

.right-panel { width: 200px; background: #F0F0F0; border-left: 1px solid #C8C8C8; display: flex; flex-direction: column; }
.palette-group { padding: 8px; font-size: 11px; color: #555; border-bottom: 1px solid #E0E0E0; }
.palette-item { padding: 2px 0; color: #333; cursor: default; }

.bottom-panel { height: 120px; background: #FFF; border-top: 1px solid #C8C8C8; display: flex; flex-direction: column; overflow: hidden; }

.out-green { color: #6A9955; }

.jframe { width: 720px; background: #F0F0F0; border: 1px solid #5A5A5A; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.4); overflow: hidden; user-select: none; }
.jframe-titlebar { height: 30px; display: flex; align-items: center; gap: 8px; padding-left: 10px; background: linear-gradient(#FAFAFA, #EDEDED); border-bottom: 1px solid #DCDCDC; }
.jframe-titlebar .title-icon { font-size: 13px; color: #2E7DD1; }
.jframe-titlebar .title-text { flex: 1; color: #1a1a1a; font-size: 12px; }
.jframe-win-btns { display: flex; height: 100%; }
.jframe-win-btn { width: 40px; height: 100%; border: none; background: transparent; cursor: pointer; font-size: 11px; color: #333; }
.jframe-win-btn:hover { background: #E5E5E5; }
.jframe-win-btn.close:hover { background: #E81123; color: #fff; }

.jframe-content { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.jpanel-titled { border: 1px solid #C8C8C8; border-radius: 3px; background: #F7F7F7; padding: 6px 14px 14px; margin: 0; }
.jpanel-titled > legend { font-size: 11px; color: #333; padding: 0 6px; margin-left: 4px; }
.jgrid { display: grid; grid-template-columns: 100px 1fr 100px 1fr; gap: 9px 10px; align-items: center; }
.jgrid label { text-align: right; color: #222; font-size: 12px; }
.jgrid input, .jgrid select { height: 24px; padding: 0 6px; border: 1px solid #B5B5B5; border-radius: 2px; background: #fff; font-family: inherit; font-size: 12px; color: #111; outline: none; }
.jgrid input:focus, .jgrid select:focus { border-color: #4A90D9; box-shadow: 0 0 0 1px #A8CDF0; }
.jgrid input:disabled, .jgrid select:disabled { background: #EEE; color: #999; }
.jbuttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.jbtn { padding: 5px 16px; font-family: inherit; font-size: 12px; color: #1a1a1a; background: linear-gradient(#FDFDFD, #E3E3E3); border: 1px solid #ADADAD; border-radius: 3px; cursor: pointer; }
.jbtn:hover { background: linear-gradient(#EDF4FC, #D6E6F7); border-color: #7EB4EA; }
.jbtn:active { background: linear-gradient(#D6E6F7, #C3DBF3); }

.jscrollpane { height: 170px; overflow: auto; border: 1px solid #B5B5B5; background: #fff; }
.jtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.jtable thead th { position: sticky; top: 0; padding: 5px 8px; text-align: left; font-weight: normal; color: #333; background: linear-gradient(#FFFFFF, #E8E8E8); border-right: 1px solid #D5D5D5; border-bottom: 1px solid #C0C0C0; white-space: nowrap; }
.jtable tbody td { padding: 4px 8px; color: #222; border-bottom: 1px solid #EDEDED; white-space: nowrap; }
.jtable tbody tr:nth-child(even) { background: #F8F8F8; }
.jtable tbody tr:hover { background: #EAF2FB; cursor: default; }
.jtable tbody tr.selected td { background: #3875D7; color: #fff; }
.jtable tbody tr.empty-row td { background: #fff; color: #999; font-style: italic; text-align: center; padding: 14px; }

.joverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); z-index: 100; }
.joverlay.show { display: flex; }
.jdialog { width: 360px; background: #F0F0F0; border: 1px solid #5A5A5A; border-radius: 3px; box-shadow: 0 12px 34px rgba(0,0,0,.55); }
.jdialog-title { padding: 6px 10px; font-weight: 600; color: #1a1a1a; background: linear-gradient(#FAFAFA, #E8E8E8); border-bottom: 1px solid #D0D0D0; }
.jdialog-body { display: flex; gap: 12px; padding: 16px 14px; align-items: flex-start; }
.jdialog-icon { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; }
.icon-info { background: #2E7DD1; }
.icon-warn { background: #E8A33D; }
.icon-error { background: #D64541; }
.jdialog-text { font-size: 12px; line-height: 1.5; color: #222; padding-top: 5px; }
.jdialog-footer { padding: 0 14px 14px; display: flex; justify-content: flex-end; }
</style>

<script>
/* =========================================================
   DATOS DE LOS EJERCICIOS 6 AL 10
   ========================================================= */
const EJERCICIOS = {

  /* ============== EJERCICIO 6 ============== */
  6: {
    nombre: "Registro de Trabajadores",
    paquete: "com.mycompany.registropersonas.ejercicio6",
    formTitulo: "Registro de Trabajadores",
    campos: [
      { id: "dni",    label: "DNI:",     tipo: "text" },
      { id: "nombre", label: "Nombre:",  tipo: "text" },
      { id: "cargo",  label: "Cargo:",   tipo: "text" },
      { id: "tipo",   label: "Tipo:",    tipo: "combo", opciones: ["Administrativo", "Vendedor"] },
      { id: "sueldo", label: "Sueldo Base:", tipo: "text" },
      { id: "ventas", label: "Ventas:",  tipo: "text", soloSi: v => v.tipo === "Vendedor" }
    ],
    columnas: ["DNI", "Nombre", "Tipo", "Sueldo Base", "Ventas", "Sueldo Final"],
    files: [
      { nombre: "Trabajador.java", activo: false, codigo: `package com.mycompany.registropersonas.ejercicio6;

<span class="cmt">/** Clase base abstracta. */</span>
<span class="kw">public abstract class</span> <span class="cls">Trabajador</span> {
    <span class="kw">protected</span> String dni;
    <span class="kw">protected</span> String nombre;
    <span class="kw">protected</span> String cargo;
    <span class="kw">protected double</span> sueldoBase;

    <span class="kw">public</span> Trabajador(String dni, String nombre, String cargo, <span class="kw">double</span> sueldoBase) {
        <span class="kw">this</span>.dni = dni;
        <span class="kw">this</span>.nombre = nombre;
        <span class="kw">this</span>.cargo = cargo;
        <span class="kw">this</span>.sueldoBase = sueldoBase;
    }

    <span class="cmt">/** Polimorfismo: cada subclase implementa su propio cálculo. */</span>
    <span class="kw">public abstract double</span> calcularSueldoFinal();

    <span class="kw">public</span> String getDni()    { <span class="kw">return</span> dni; }
    <span class="kw">public</span> String getNombre() { <span class="kw">return</span> nombre; }
    <span class="kw">public</span> String getCargo()  { <span class="kw">return</span> cargo; }
    <span class="kw">public double</span> getSueldoBase() { <span class="kw">return</span> sueldoBase; }
}` },
      { nombre: "Administrativo.java", activo: false, codigo: `package com.mycompany.registropersonas.ejercicio6;

<span class="kw">public class</span> <span class="cls">Administrativo</span> <span class="kw">extends</span> <span class="cls">Trabajador</span> {

    <span class="kw">public</span> Administrativo(String dni, String nombre, String cargo, <span class="kw">double</span> sueldoBase) {
        <span class="kw">super</span>(dni, nombre, cargo, sueldoBase);
    }

    <span class="ann">@Override</span>
    <span class="kw">public double</span> calcularSueldoFinal() {
        <span class="cmt">// Sueldo base + 15% de bonificación</span>
        <span class="kw">return</span> sueldoBase + (sueldoBase * 0.15);
    }
}` },
      { nombre: "Vendedor.java", activo: false, codigo: `package com.mycompany.registropersonas.ejercicio6;

<span class="kw">public class</span> <span class="cls">Vendedor</span> <span class="kw">extends</span> <span class="cls">Trabajador</span> {
    <span class="kw">private final double</span> ventas;

    <span class="kw">public</span> Vendedor(String dni, String nombre, String cargo, <span class="kw">double</span> sueldoBase, <span class="kw">double</span> ventas) {
        <span class="kw">super</span>(dni, nombre, cargo, sueldoBase);
        <span class="kw">this</span>.ventas = ventas;
    }

    <span class="ann">@Override</span>
    <span class="kw">public double</span> calcularSueldoFinal() {
        <span class="cmt">// Sueldo base + 5% del total de ventas</span>
        <span class="kw">return</span> sueldoBase + (ventas * 0.05);
    }

    <span class="kw">public double</span> getVentas() { <span class="kw">return</span> ventas; }
}` },
      { nombre: "FrmTrabajador.java", activo: true, codigo: `package com.mycompany.registropersonas.ejercicio6;

<span class="kw">import</span> java.util.ArrayList;
<span class="kw">import</span> javax.swing.JOptionPane;
<span class="kw">import</span> javax.swing.table.DefaultTableModel;

<span class="kw">public class</span> <span class="cls">FrmTrabajador</span> <span class="kw">extends</span> javax.swing.JFrame {

    <span class="kw">private final</span> ArrayList&lt;Trabajador&gt; listaTrabajadores = <span class="kw">new</span> ArrayList&lt;&gt;();
    <span class="kw">private final</span> DefaultTableModel modeloTabla;

    <span class="kw">public</span> FrmTrabajador() {
        initComponents();
        modeloTabla = (DefaultTableModel) jTable1.getModel();
        modeloTabla.setColumnIdentifiers(<span class="kw">new</span> Object[]{
            <span class="str">"DNI"</span>, <span class="str">"Nombre"</span>, <span class="str">"Tipo"</span>, <span class="str">"Sueldo Base"</span>, <span class="str">"Ventas"</span>, <span class="str">"Sueldo Final"</span>
        });
        modeloTabla.setRowCount(0);
    }

    <span class="kw">private void</span> btnRegistrarActionPerformed(java.awt.event.ActionEvent evt) {
        String dni    = txtDni.getText().trim();
        String nombre = txtNombre.getText().trim();
        String cargo  = txtCargo.getText().trim();
        String tipo   = (String) cboTipo.getSelectedItem();
        String sStr   = txtSueldo.getText().trim();

        <span class="kw">if</span> (dni.isEmpty() || nombre.isEmpty() || cargo.isEmpty() || sStr.isEmpty()) {
            JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Todos los campos son obligatorios."</span>);
            <span class="kw">return</span>;
        }
        <span class="kw">double</span> sueldo;
        <span class="kw">try</span> {
            sueldo = Double.parseDouble(sStr);
            <span class="kw">if</span> (sueldo &lt;= 0) {
                JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"El sueldo base debe ser mayor que cero."</span>);
                <span class="kw">return</span>;
            }
        } <span class="kw">catch</span> (NumberFormatException e) {
            JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Sueldo inválido."</span>);
            <span class="kw">return</span>;
        }
        <span class="kw">for</span> (Trabajador t : listaTrabajadores) {
            <span class="kw">if</span> (t.getDni().equals(dni)) {
                JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Ya existe un trabajador con el DNI "</span> + dni);
                <span class="kw">return</span>;
            }
        }

        Trabajador t;
        <span class="kw">double</span> ventas = 0;
        <span class="kw">if</span> (tipo.equals(<span class="str">"Administrativo"</span>)) {
            t = <span class="kw">new</span> Administrativo(dni, nombre, cargo, sueldo);
        } <span class="kw">else</span> {
            String vStr = txtVentas.getText().trim();
            <span class="kw">try</span> {
                ventas = vStr.isEmpty() ? 0 : Double.parseDouble(vStr);
                <span class="kw">if</span> (ventas &lt; 0) {
                    JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Las ventas deben ser >= 0."</span>);
                    <span class="kw">return</span>;
                }
            } <span class="kw">catch</span> (NumberFormatException e) {
                JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Ventas inválidas."</span>);
                <span class="kw">return</span>;
            }
            t = <span class="kw">new</span> Vendedor(dni, nombre, cargo, sueldo, ventas);
        }

        listaTrabajadores.add(t);
        <span class="kw">double</span> sueldoFinal = t.calcularSueldoFinal();   <span class="cmt">// Polimorfismo</span>
        modeloTabla.addRow(<span class="kw">new</span> Object[]{dni, nombre, tipo,
            String.format(<span class="str">"%.2f"</span>, sueldo),
            ventas == 0 ? <span class="str">"-"</span> : String.format(<span class="str">"%.2f"</span>, ventas),
            String.format(<span class="str">"%.2f"</span>, sueldoFinal)});
        limpiarCampos();
        JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Trabajador registrado. Sueldo final: S/ "</span>
            + String.format(<span class="str">"%.2f"</span>, sueldoFinal));
    }

    <span class="kw">private void</span> btnEliminarActionPerformed(java.awt.event.ActionEvent evt) {
        <span class="kw">int</span> fila = jTable1.getSelectedRow();
        <span class="kw">if</span> (fila == -1) {
            JOptionPane.showMessageDialog(<span class="kw">this</span>, <span class="str">"Seleccione un trabajador."</span>);
            <span class="kw">return</span>;
        }
        listaTrabajadores.remove(fila);
        modeloTabla.removeRow(fila);
    }

    <span class="kw">private void</span> limpiarCampos() {
        txtDni.setText(<span class="str">""</span>);
        txtNombre.setText(<span class="str">""</span>);
        txtCargo.setText(<span class="str">""</span>);
        txtSueldo.setText(<span class="str">""</span>);
        txtVentas.setText(<span class="str">""</span>);
        cboTipo.setSelectedIndex(0);

function mostrarMensaje(texto, tipo = 'info') {
  const iconos = { info:'i', warn:'!', error:'✕' };
  const titulos = { info:'Información', warn:'Advertencia', error:'Error' };
  $('dlgIcon').className = 'jdialog-icon icon-' + tipo;
  $('dlgIcon').textContent = iconos[tipo];
  $('dlgTitle').textContent = titulos[tipo];
  $('dlgText').textContent = texto;
  $('overlay').classList.add('show');
  $('dlgOk').focus();
}
$('dlgOk').addEventListener('click', () => $('overlay').classList.remove('show'));
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('show'); });

function renderTree() {
  const ex = EJERCICIOS[ejercicioActual];

   REGISTRAR / ELIMINAR / LIMPIAR
   ========================================================= */
function leerValores() {
  const ex = EJERCICIOS[ejercicioActual];
  const v = {};
  ex.campos.forEach(c => {
    const el = $(c.id);
    v[c.id] = el ? el.value.trim() : '';
  });
  return v;
}

function registrar() {
  const ex = EJERCICIOS[ejercicioActual];
  const v = leerValores();
  const res = ex.validar(v);
  if (!res.ok) return mostrarMensaje(res.msg, res.tipo);

  if (ex.claveUnica) {
    if (!registros[ejercicioActual]) registros[ejercicioActual] = {};
    if (registros[ejercicioActual][v[ex.claveUnica]]) {
      return mostrarMensaje(`Ya existe un registro con el ${ex.claveLabel} ${v[ex.claveUnica]}.`, 'error');
    }
    registros[ejercicioActual][v[ex.claveUnica]] = v;
  }

  if (!contadores[ejercicioActual]) contadores[ejercicioActual] = 1;
  const c = contadores[ejercicioActual];

  const fila = ex.calcularFila(v, c);
  if (ejercicioActual === 7) contadores[ejercicioActual]++;

  if (!tablasDatos[ejercicioActual]) tablasDatos[ejercicioActual] = [];
  tablasDatos[ejercicioActual].push(fila);

  renderTabla();
  limpiarCampos(false);

  let msg = 'Registro guardado correctamente.';
  if (ejercicioActual === 6) msg = `Trabajador registrado. Sueldo final: S/ ${fila[5]}`;
  if (ejercicioActual === 7) msg = `Figura: ${fila[1]} | Área: ${fila[2]} | Perímetro: ${fila[3]}`;
  if (ejercicioActual === 8) msg = `Promedio: ${fila[5]} — ${fila[6]}`;
  if (ejercicioActual === 9) msg = `Precio final: S/ ${fila[6]}`;
  if (ejercicioActual === 10) msg = `Pago: S/ ${fila[4]}`;
  mostrarMensaje(msg, 'info');
}

function eliminar() {
  if (seleccionado < 0) return mostrarMensaje('Seleccione un registro de la tabla para eliminar.', 'warn');
  tablasDatos[ejercicioActual].splice(seleccionado, 1);
  seleccionado = -1;
  renderTabla();
  mostrarMensaje('Registro eliminado.', 'info');
}

function limpiarCampos(enfocar = true) {
  const ex = EJERCICIOS[ejercicioActual];
  ex.campos.forEach(c => {
    const el = $(c.id);
    if (!el) return;
    if (c.tipo === 'combo') el.selectedIndex = 0;
    else el.value = '';
  });
  if (enfocar) {
    const p = $(ex.campos[0].id);
    if (p && !p.disabled) p.focus();
  }
  if (ejercicioActual === 6 || ejercicioActual === 7 || ejercicioActual === 10) {
    const cboTipo = $(ex.campos.find(c => c.tipo === 'combo').id);
    if (cboTipo) cboTipo.dispatchEvent(new Event('change'));
  }
}

function renderTabla() {
  const tbody = $('tbody');
  if (!tbody) return;
  const ex = EJERCICIOS[ejercicioActual];
  const datos = tablasDatos[ejercicioActual] || [];

  tbody.innerHTML = '';
  if (datos.length === 0) {
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    const td = document.createElement('td');
    td.colSpan = ex.columnas.length;
    td.textContent = 'No hay registros.';
    tr.appendChild(td);
    tbody.appendChild(tr);
  } else {
    datos.forEach((fila, i) => {
      const tr = document.createElement('tr');
      if (i === seleccionado) tr.classList.add('selected');
      fila.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      });
      tr.addEventListener('click', () => { seleccionado = i; renderTabla(); });
      tbody.appendChild(tr);
    });
  }
}

/* =========================================================
   TABS
   ========================================================= */
function switchTab(tab) {
  const vs = $('viewSource'), vd = $('viewDesign');
  const ts = $('tabSource'), td = $('tabDesign');
  if (tab === 'source') {
    vs.classList.add('active'); vd.classList.remove('active');
    ts.classList.add('active'); td.classList.remove('active');
  } else {
    vs.classList.remove('active'); vd.classList.add('active');
    ts.classList.remove('active'); td.classList.add('active');
    renderDesign();
  }
}

/* =========================================================
   CAMBIO DE EJERCICIO
   ========================================================= */
document.querySelectorAll('.ex-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ex-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ejercicioActual = parseInt(btn.dataset.ex, 10);
    indiceArchivo = 0;
    seleccionado = -1;
    renderTree();
    renderSource();
    switchTab('source');
    $('outputLog').innerHTML =
      `<span class="out-green">--- exec:3.0:exec (default-cli) @ RegistroPersonas ---</span><br>` +
      `Cargando ejercicio ${ejercicioActual}: ${EJERCICIOS[ejercicioActual].nombre}...<br>` +
      `<span class="out-blue">-------------------------------------------------------</span><br>` +
      `<span class="out-green">BUILD SUCCESSFUL</span>`;
  });
});

/* =========================================================
   BOTÓN RUN
   ========================================================= */
$('btnRun').addEventListener('click', () => {
  $('outputLog').innerHTML =
    `<span class="out-green">--- exec:3.0:exec (default-cli) @ RegistroPersonas ---</span><br>` +
    `Ejecutando ejercicio ${ejercicioActual}...<br>` +
    `<span class="out-blue">-------------------------------------------------------</span><br>` +
    `<span class="out-green">BUILD SUCCESSFUL</span><br>` +
    `Total time: 4.212 s<br>` +
    `Finished at: ${new Date().toISOString().replace('T', ' ').substring(0, 19)}<br>` +
    `<span class="out-blue">-------------------------------------------------------</span>`;
  switchTab('design');
});

/* =========================================================
   INICIO
   ========================================================= */
window.addEventListener('load', () => {
  renderTree();
  renderSource();
  $('outputLog').innerHTML =
    `<span class="out-green">--- exec:3.0:exec (default-cli) @ RegistroPersonas ---</span><br>` +
    `Hello World!<br>` +
    `<span class="out-blue">-------------------------------------------------------</span><br>` +
    `<span class="out-green">BUILD SUCCESSFUL</span><br>` +
    `Total time: 5.081 s<br>` +
    `<span class="out-blue">-------------------------------------------------------</span>`;
});
